name: Market prices

on:
  schedule:
    # GitHub schedules in UTC. Each pair covers daylight-saving and standard time; the script acts on
    # whichever lands at 9:35 a.m., 12:00 or 4:05 p.m. New York time and skips the other.
    - cron: "35 13,14 * * 1-5"
    - cron: "0 16,17 * * 1-5"
    - cron: "5 20,21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read share prices
        env:
          TIINGO_TOKEN: ${{ secrets.TIINGO_TOKEN }}
        run: python scripts/markets.py ${{ github.event_name == 'workflow_dispatch' && '--now' || '' }}

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/markets.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Market prices $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              sleep 10
            done
          fi
