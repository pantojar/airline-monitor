name: Probe (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          python3 - <<'PY'
          import json, urllib.request, re, html
          UA = "Mozilla/5.0 (compatible; AirlineFinancialMonitor/1.0)"
          q4 = "/feed/PressRelease.svc/GetPressReleaseList?LanguageId=1&bodyType=0&pressReleaseDateFilter=3&categoryId=1cb807d2-208f-4bc3-9133-6a9ad45ac3b0&pageSize=50&pageNumber=0&tagList=&includeTags=true&year=-1&excludeSelection=1"
          q4b = "/feed/PressRelease.svc/GetPressReleaseList?LanguageId=1&bodyType=0&pressReleaseDateFilter=3&pageSize=50&pageNumber=0&year=-1&excludeSelection=1"
          bases = ["https://news.aa.com", "https://news.jetblue.com", "https://ir.allegiantair.com", "https://ir.delta.com", "https://ir.flyfrontier.com", "https://www.swamedia.com", "https://investors.southwest.com", "https://united.mediaroom.com", "https://www.skywest.com", "https://inc.skywest.com", "https://newsroom.allegiantair.com", "https://www.endeavorair.com"]
          paths = ["", q4, q4b, "/news-events/press-releases/rss", "/news-releases?pagetemplate=rss&l=50", "/rss", "/feed", "/feed/", "/news", "/news/default.aspx", "/releases", "/press-releases", "/rss.xml", "/news-releases"]
          out = {}
          for b in bases:
              r = {}
              for p in paths:
                  try:
                      with urllib.request.urlopen(urllib.request.Request(b + p, headers={"User-Agent": UA, "Accept": "*/*"}), timeout=20) as resp:
                          data = resp.read(400000).decode("utf-8", "replace")
                          ct = resp.headers.get("Content-Type", "")
                          info = {"status": resp.status, "ct": ct[:40], "len": len(data)}
                          if p in ("", "/news-releases", "/news", "/releases", "/press-releases", "/news/default.aspx"):
                              info["feeds"] = re.findall(r'<link[^>]+type="application/(?:rss|atom)\+xml"[^>]*>', data)[:4]
                              info["title"] = (re.search(r"<title>(.*?)</title>", data, re.S) or [None, ""])[1].strip()[:80]
                              info["sample_links"] = list(dict.fromkeys(re.findall(r'href="([^"]*(?:news|release|press|stories|story)[^"]*)"', data)))[:12]
                          if p.startswith("/feed/PressRelease"):
                              try:
                                  j = json.loads(data); L = j.get("GetPressReleaseListResult") or []
                                  info["q4"] = len(L); info["first"] = [(x.get("PressReleaseDate"), x.get("Headline", "")[:80], x.get("LinkToDetailPage")) for x in L[:3]]
                              except Exception as e: info["q4err"] = type(e).__name__ + data[:120]
                          if "<item>" in data or "<entry" in data:
                              info["items"] = data.count("<item>") + data.count("<entry")
                              info["first"] = [html.unescape(t)[:90] for t in re.findall(r"<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?</title>", data)[1:4]]
                          if p.startswith("/wp-json"):
                              try: info["wp"] = [x["title"]["rendered"][:80] for x in json.loads(data)]
                              except Exception: pass
                          r[p or "/"] = info
                  except Exception as e:
                      r[p or "/"] = "ERR " + (str(getattr(e, "code", "")) or type(e).__name__)
              out[b] = r
          json.dump(out, open("carriers2.json", "w"), indent=1)
          PY
          git init -q && git checkout -q -b probe
          git config user.name probe && git config user.email probe@example.com
          git add -A && git commit -qm probe
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
