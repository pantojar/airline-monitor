name: Probe (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          SEC_CONTACT: ${{ vars.SEC_CONTACT }}
        run: |
          mkdir out && cd out
          python3 - <<'PY'
          import json, urllib.request, os, re
          ua = "AirlineFinancialMonitor " + os.environ.get("SEC_CONTACT", "")
          out = {}
          for t, cik in [("ALK",766421),("RJET",810332)]:
              cf = json.load(urllib.request.urlopen(urllib.request.Request(f"https://data.sec.gov/api/xbrl/companyfacts/CIK{cik:010d}.json", headers={"User-Agent": ua}), timeout=60))
              res = {}
              for ns, g in cf.get("facts", {}).items():
                  for c, v in g.items():
                      if not re.search(r"Payment|Purchase|Acqui|Capital|Equipment|Aircraft|Deposit", c): continue
                      fs = [f for f in v.get("units", {}).get("USD", []) if f.get("start") and re.match(r"10-[QK]", f.get("form","")) and f["end"] >= "2025-01-01"]
                      if fs: res[ns + ":" + c] = sorted({(f["start"], f["end"], f["val"]) for f in fs})
              out[t] = res
          json.dump(out, open("alk.json","w"), indent=1)
          PY
          git init -q && git checkout -q -b probe
          git config user.name probe && git config user.email probe@example.com
          git add -A && git commit -qm probe
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
