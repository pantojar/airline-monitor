name: Probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -A "Mozilla/5.0 (compatible; AirlineFinancialMonitor)" https://www.eia.gov/todayinenergy/prices.php -o p.html; wc -c p.html
          grep -n -i -E "Close|Low-Sulfur|Heating Oil|Jet" p.html | head -40
          python3 - <<'PY'
          import re
          s=open('p.html',encoding='utf-8',errors='replace').read()
          i=s.find('Low-Sulfur'); print(s[max(0,i-1500):i+2500])
          PY
