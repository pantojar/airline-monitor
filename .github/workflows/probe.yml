name: Probe (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          python3 - <<'PY'
          import json, urllib.request, re, html
          UA = "Mozilla/5.0 (compatible; AirlineFinancialMonitor/1.0)"
          bases = ["https://news.delta.com", "https://united.mediaroom.com", "https://news.aa.com", "https://www.swamedia.com",
                   "https://news.alaskaair.com", "https://news.jetblue.com", "https://news.flyfrontier.com", "https://ir.allegiantair.com",
                   "https://inc.skywest.com", "https://rjet.com", "https://newsroom.hawaiianairlines.com", "https://www.envoyair.com",
                   "https://www.piedmont-airlines.com", "https://www.psaairlines.com", "https://www.endeavorair.com", "https://news.allegiantair.com",
                   "https://ir.jetblue.com", "https://ir.united.com", "https://ir.delta.com", "https://americanairlines.gcs-web.com", "https://www.southwestairlinesinvestorrelations.com", "https://investor.alaskaair.com", "https://ir.flyfrontier.com", "https://ir.suncountry.com"]
          paths = ["", "/wp-json/wp/v2/posts?per_page=2&_fields=date,title", "/feed/", "/rss", "/rss.xml", "/news-releases?pagetemplate=rss", "/rss/news-releases.xml", "/news/rss", "/news-releases/rss", "/press-releases/rss", "/feed/rss2", "/news-releases"]
          out = {}
          for b in bases:
              r = {}
              for p in paths:
                  try:
                      with urllib.request.urlopen(urllib.request.Request(b + p, headers={"User-Agent": UA, "Accept": "*/*"}), timeout=20) as resp:
                          data = resp.read(400000).decode("utf-8", "replace")
                          ct = resp.headers.get("Content-Type", "")
                          info = {"status": resp.status, "ct": ct[:40], "len": len(data)}
                          if p == "" or p == "/news-releases":
                              info["feeds"] = re.findall(r'<link[^>]+type="application/(?:rss|atom)\+xml"[^>]*>', data)[:4]
                              info["title"] = (re.search(r"<title>(.*?)</title>", data, re.S) or [None, ""])[1].strip()[:80]
                              info["sample_links"] = list(dict.fromkeys(re.findall(r'href="([^"]*(?:news|release|press|stories|story)[^"]*)"', data)))[:12]
                          if "<item>" in data or "<entry" in data:
                              info["items"] = data.count("<item>") + data.count("<entry")
                              info["first"] = [html.unescape(t)[:90] for t in re.findall(r"<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?</title>", data)[1:4]]
                          if p.startswith("/wp-json"):
                              try: info["wp"] = [x["title"]["rendered"][:80] for x in json.loads(data)]
                              except Exception: pass
                          r[p or "/"] = info
                  except Exception as e:
                      r[p or "/"] = "ERR " + (str(getattr(e, "code", "")) or type(e).__name__)
              out[b] = r
          json.dump(out, open("carriers.json", "w"), indent=1)
          PY
          git init -q && git checkout -q -b probe
          git config user.name probe && git config user.email probe@example.com
          git add -A && git commit -qm probe
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
