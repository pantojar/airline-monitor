name: Probe (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          SEC_CONTACT: ${{ vars.SEC_CONTACT }}
        run: |
          mkdir out && cd out
          python3 - <<'PY'
          import json, urllib.request, os, re
          ua = "AirlineFinancialMonitor " + os.environ.get("SEC_CONTACT", "")
          out = {}
          for t, cik in [("JBLU",1158463),("DAL",27904),("UAL",100517),("AAL",6201),("LUV",92380),("ALK",766421),("ULCC",1670076),("ALGT",1362468),("SKYW",793733),("RJET",810332)]:
              cf = json.load(urllib.request.urlopen(urllib.request.Request(f"https://data.sec.gov/api/xbrl/companyfacts/CIK{cik:010d}.json", headers={"User-Agent": ua}), timeout=60))
              res = {}
              for ns, g in cf.get("facts", {}).items():
                  for c, v in g.items():
                      if not re.search(r"PaymentsToAcquire|PaymentsFor.*(Flight|Aircraft|Equipment|Capital)|CapitalExpend|Current$|DueInNextTwelve|NextTwelveMonths|MaturitiesRepaymentsOfPrincipalInNext", c): continue
                      if re.search(r"Current$", c) and not re.search(r"Debt|Lease|Borrow|Notes|Obligation", c): continue
                      fs = [f for f in v.get("units", {}).get("USD", []) if re.match(r"10-[QK]", f.get("form",""))]
                      if not fs: continue
                      f = max(fs, key=lambda f: (f["end"], f.get("filed","")))
                      if f["end"] >= "2025-06-01":
                          res[ns + ":" + c] = [f.get("start"), f["end"], f["val"]]
              out[t] = res
          json.dump(out, open("capex.json","w"), indent=1)
          PY
          git init -q && git checkout -q -b probe
          git config user.name probe && git config user.email probe@example.com
          git add -A && git commit -qm probe
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
