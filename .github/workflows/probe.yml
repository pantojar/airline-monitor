name: Probe (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          for u in "https://www.transtats.bts.gov/OT_Delay/ot_delaycause1_DL.aspx?8n4=9ur4r%20Brn4z106u%20or69rr0%20FHGFD%20NaQ%20FHGFD" "https://www.transtats.bts.gov/OT_Delay/ot_delaycause1_DL.aspx?8n4=9ur4r%20Brn4z106u%20or69rr0%20FHGEG%20NaQ%20FHGFD" "https://www.bts.gov/airline-data-downloads" "https://www.bts.gov/topics/airlines-and-airports/airline-time-performance-and-causes-flight-delays"; do
            n=$(echo "$u" | md5sum | cut -c1-8); curl -s -L -A "Mozilla/5.0 (compatible; AirlineFinancialMonitor/1.0)" "$u" -o "p_$n.html" -w "$n %{http_code} %{size_download} $u\n" >> index.txt || true
          done
          git init -q && git checkout -q -b probe
          git config user.name probe && git config user.email probe@example.com
          git add -A && git commit -qm probe
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
