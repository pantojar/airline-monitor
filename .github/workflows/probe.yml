name: Probe (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          SEC_CONTACT: ${{ vars.SEC_CONTACT }}
        run: |
          mkdir out && cd out
          python3 - <<'PY'
          import json, urllib.request, os, re, xml.etree.ElementTree as ET
          ua = "AirlineFinancialMonitor " + os.environ.get("SEC_CONTACT", "")
          def get(u, ua2=None):
              return urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": ua2 or ua}), timeout=90).read()
          out = {}
          u = "https://www.transtats.bts.gov/Tables.asp?QO_VQ=EGI&QO_anzr=Nv4%FDPn44vr4%FDSv0n0pvny%FDer21465%FD%FLS14z%FDHE%FDSv0n0pvny%FDQn6n%FM&QO_fu146_anzr=Nv4%FDPn44vr4%FDSv0n0pvny"
          page = get(u, "Mozilla/5.0").decode("utf-8", "replace")
          out["tables"] = re.findall(r"gnoyr_VQ=([A-Z]{3})[^>]*>([^<]*)", page)[:120]
          out["b43"] = [m for m in re.findall(r"([A-Z]{3})[^A-Z]{0,400}?B-43", page)][:10]
          i = page.find("B-43"); out["ctx"] = re.sub(r"\s+", " ", page[max(0, i-800):i+300])
          codes = sorted(set(c for c, n in out["tables"]))
          out["fields"] = {}
          for c in codes:
              try:
                  pg = get("https://www.transtats.bts.gov/DL_SelectFields.aspx?gnoyr_VQ=" + c + "&QO_fu146_anzr=Nv4%20Pn44vr4%20Sv0n0pvny", "Mozilla/5.0").decode("utf-8", "replace")
                  title = (re.search(r"<title>(.*?)</title>", pg, re.S) or [0, ""])[1].strip()
                  flds = re.findall(r'<input[^>]*type="checkbox"[^>]*(?:id|name)="([A-Z_0-9]+)"', pg)
                  out["fields"][c] = [title[:80], re.findall(r"(?:Schedule|Table)[^<]{0,60}", pg)[:3], flds[:40]]
              except Exception as e:
                  out["fields"][c] = repr(e)
          json.dump(out, open("probe.json","w"), indent=1)
          PY
          git init -q && git checkout -q -b probe
          git config user.name probe && git config user.email probe@example.com
          git add -A && git commit -qm probe
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
