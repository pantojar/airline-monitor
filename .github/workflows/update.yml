name: Refresh data

on:
  schedule:
    - cron: "17 10 * * *"   # daily, 6:17 a.m. Eastern (5:17 a.m. in winter)
  workflow_dispatch: {}      # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths: ["scripts/**", "config/**"]

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull SEC filings and news
        env:
          SEC_CONTACT: ${{ vars.SEC_CONTACT }}
        run: python scripts/update.py

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Data refresh $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
