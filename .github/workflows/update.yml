name: Refresh data

on:
  schedule:
    - cron: "17 10 * * *"   # daily, 6:17 a.m. Eastern (5:17 a.m. in winter)
    - cron: "50 13 * * 1-5" # weekdays, 9:50 a.m. Eastern: after EIA posts the day's fuel prices (7:30-8:30 a.m.)
    - cron: "7 21 * * *"    # daily, 5:07 p.m. Eastern (4:07 p.m. in winter): picks up 10-Qs filed during the day
  workflow_dispatch:         # "Run workflow" button on the Actions tab
    inputs:
      force_dot:
        description: "Also refresh DOT Form 41 data now (otherwise it refreshes weekly)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["scripts/**", "config/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF reader
        run: pip install --quiet pypdf==4.3.1

      - name: Pull SEC filings and news
        env:
          SEC_CONTACT: ${{ vars.SEC_CONTACT }}
          FORCE_DOT: ${{ inputs.force_dot }}
        run: python scripts/update.py

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Data refresh $(date -u +%Y-%m-%d)"
            git pull --rebase -X theirs origin main
            git push
          fi
